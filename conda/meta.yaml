{% set name = "pyigd" %}
{% set version = "1.3" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: 82c317b7e193b186ae640bd8f1645724a219f9abbd2ac318d38e34872ccaf14d

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - pip
    - python
  run:
    - python

test:
  imports:
    - pyigd

about:
  home: "https://aprilweilab.github.io/"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Parser for IGD files"
  doc_url: "https://pyigd.readthedocs.io/en/latest/index.html"
  dev_url: "https://github.com/aprilweilab/pyigd"

extra:
  recipe-maintainers:
    - dcdehaas
